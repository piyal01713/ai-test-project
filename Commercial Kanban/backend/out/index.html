<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commercial Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    /* Drag and drop styling */
    .card-dragging { opacity: 0.5; transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .col-drop-target { background-color: #f8fafc; border: 2px dashed #209dd7; }
    
    /* Smooth transitions */
    .btn-transition { transition: all 0.2s ease-in-out; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased overflow-hidden">
  <div id="app" class="h-screen flex flex-col"></div>

  <script>
    let token = localStorage.getItem('kanban_token') || null;
    let board = null;
    let sidebarOpen = true;
    let messages = [];
    let draggedCardId = null;

    const icons = {
      plus: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
      trash: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`,
      bot: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>`,
      send: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
      logout: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>`,
      edit: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`
    };

    async function login(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const errEl = document.getElementById('auth-error');
      errEl.classList.add('hidden');
      document.getElementById('login-btn').innerHTML = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: u, password: p})
        });
        if (res.ok) {
          const data = await res.json();
          token = data.token;
          localStorage.setItem('kanban_token', token);
          render();
        } else {
          errEl.innerText = 'Invalid credentials (use "user" / "password")';
          errEl.classList.remove('hidden');
          document.getElementById('login-btn').innerHTML = 'Sign In';
        }
      } catch (err) {
        errEl.innerText = 'Connection error';
        errEl.classList.remove('hidden');
        document.getElementById('login-btn').innerHTML = 'Sign In';
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('kanban_token');
      render();
    }

    async function fetchBoard() {
      if (!token) return;
      try {
        const res = await fetch('/api/board', {
          headers: {'Authorization': `Bearer ${token}`}
        });
        if (res.ok) {
          board = await res.json();
          renderApp();
        } else if (res.status === 401) {
          logout();
        }
      } catch(e) {}
    }

    async function addCard(columnId) {
      const title = prompt("Enter Card Title:");
      if (!title || !title.trim()) return;
      const description = prompt("Enter Description (optional):") || "";
      
      // Optimistic update
      const col = board.columns.find(c => c.id === columnId);
      const tempId = Date.now(); // temporary ID
      if(col) col.cards.push({ id: tempId, column_id: columnId, title, description, position: col.cards.length });
      renderApp();

      try {
        await fetch('/api/cards', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
          body: JSON.stringify({column_id: columnId, title, description})
        });
      } catch (err) { console.error(err); }
      fetchBoard();
    }

    async function deleteCard(cardId, e) {
      e.stopPropagation();
      if (!confirm("Are you sure you want to delete this card?")) return;
      
      // Optimistic update
      for (let col of board.columns) {
        col.cards = col.cards.filter(c => c.id !== cardId);
      }
      renderApp();

      try {
        await fetch(`/api/cards/${cardId}`, {
          method: 'DELETE',
          headers: {'Authorization': `Bearer ${token}`}
        });
      } catch (err) { console.error(err); }
      fetchBoard();
    }
    
    async function editCard(cardId, e) {
      e.stopPropagation();
      let card = null;
      for (let col of board.columns) {
        const found = col.cards.find(c => c.id === cardId);
        if (found) { card = found; break; }
      }
      if (!card) return;
      
      const title = prompt("Edit Card Title:", card.title);
      if (title === null || !title.trim()) return;
      const description = prompt("Edit Description:", card.description) || "";
      
      card.title = title;
      card.description = description;
      renderApp();
      
      try {
        await fetch(`/api/cards/${cardId}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
          body: JSON.stringify({column_id: card.column_id, position: card.position, title, description})
        });
      } catch (err) { console.error(err); }
      fetchBoard();
    }

    /* Drag and Drop Handlers */
    function dragStart(e, cardId) {
      draggedCardId = cardId;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', cardId);
      setTimeout(() => e.target.classList.add('card-dragging'), 0);
    }

    function dragEnd(e) {
      e.target.classList.remove('card-dragging');
      draggedCardId = null;
      document.querySelectorAll('.col-drop-target').forEach(el => el.classList.remove('col-drop-target'));
    }

    function dragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function dragEnter(e) {
      e.preventDefault();
      const colEl = e.target.closest('.kanban-column');
      if (colEl) colEl.classList.add('col-drop-target');
    }

    function dragLeave(e) {
      const colEl = e.target.closest('.kanban-column');
      if (colEl && !colEl.contains(e.relatedTarget)) {
        colEl.classList.remove('col-drop-target');
      }
    }

    async function drop(e, columnId) {
      e.preventDefault();
      const colEl = e.target.closest('.kanban-column');
      if (colEl) colEl.classList.remove('col-drop-target');
      
      const cardId = draggedCardId || parseInt(e.dataTransfer.getData('text/plain'));
      if (!cardId) return;

      let movedCard = null;
      let sourceColId = null;
      for (let col of board.columns) {
        const idx = col.cards.findIndex(c => c.id === parseInt(cardId));
        if (idx !== -1) {
          movedCard = col.cards.splice(idx, 1)[0];
          sourceColId = col.id;
          break;
        }
      }

      if (movedCard) {
        movedCard.column_id = columnId;
        const targetCol = board.columns.find(c => c.id === columnId);
        
        // Find insert position based on Y coordinate
        let insertIndex = targetCol.cards.length;
        const cardElements = colEl.querySelectorAll('.kanban-card');
        const y = e.clientY;
        
        for (let i = 0; i < cardElements.length; i++) {
          const rect = cardElements[i].getBoundingClientRect();
          if (y < rect.top + rect.height / 2) {
            insertIndex = i;
            break;
          }
        }
        
        targetCol.cards.splice(insertIndex, 0, movedCard);
        
        // Update positions
        targetCol.cards.forEach((c, idx) => c.position = idx);
        renderApp();

        try {
          await fetch(`/api/cards/${cardId}/move`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ column_id: columnId, position: insertIndex })
          });
        } catch (err) {
          console.error(err);
        }
        fetchBoard(); // Re-sync with server
      }
    }

    async function sendAiMessage(e) {
      e.preventDefault();
      const input = document.getElementById('ai-input');
      const msg = input.value.trim();
      const btn = document.getElementById('ai-send-btn');
      if (!msg) return;
      
      input.value = '';
      input.disabled = true;
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-pulse">...</span>`;
      
      messages.push({role: 'user', content: msg});
      renderApp();

      try {
        const res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
          body: JSON.stringify({message: msg, history: messages})
        });
        const data = await res.json();
        messages.push({role: 'assistant', content: data.message});
        fetchBoard();
      } catch(e) {
        messages.push({role: 'assistant', content: 'Failed to reach AI endpoint.'});
        renderApp();
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (!token) {
        app.innerHTML = `
          <div class="h-full w-full bg-[#032147] flex items-center justify-center p-4 relative overflow-hidden">
            <!-- Decorative background elements -->
            <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
              <div class="absolute -top-32 -left-32 w-96 h-96 bg-[#209dd7] rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
              <div class="absolute top-1/2 right-0 w-[500px] h-[500px] bg-[#753991] rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2"></div>
            </div>
            
            <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 max-w-md w-full border-t-4 border-[#ecad0a] relative z-10 transform transition-all">
              <div class="mb-8 text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-[#032147]/10 mb-4">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#209dd7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                </div>
                <h1 class="text-2xl font-bold text-[#032147] tracking-tight">Commercial Kanban</h1>
                <p class="text-[#888888] text-sm mt-1">Sign in to manage your workspace</p>
              </div>

              <div id="auth-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-6 border border-red-100 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="auth-error-text"></span>
              </div>

              <form onsubmit="login(event)" class="space-y-5">
                <div>
                  <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Username</label>
                  <input type="text" id="username" value="user" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#209dd7] focus:border-transparent focus:outline-none transition-all text-sm" required />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Password</label>
                  <input type="password" id="password" value="password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#209dd7] focus:border-transparent focus:outline-none transition-all text-sm" required />
                </div>
                <button type="submit" id="login-btn" class="w-full bg-[#753991] hover:bg-[#602b79] text-white font-semibold py-3 rounded-lg btn-transition shadow-lg shadow-[#753991]/30 mt-2">
                  Sign In
                </button>
              </form>
            </div>
          </div>
        `;
      } else {
        fetchBoard();
      }
    }

    function renderApp() {
      const app = document.getElementById('app');
      if (!board) return;

      app.innerHTML = `
        <!-- Top Navigation -->
        <header class="bg-[#032147] text-white px-6 py-3.5 flex items-center justify-between shadow-md z-20 shrink-0">
          <div class="flex items-center space-x-3">
            <div class="h-5 w-1.5 bg-[#ecad0a] rounded-full shadow-[0_0_8px_rgba(236,173,10,0.6)]"></div>
            <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#209dd7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
              ${board.title}
            </h1>
          </div>
          <div class="flex items-center space-x-5">
            <div class="flex items-center space-x-2 bg-white/10 px-3 py-1.5 rounded-full border border-white/5">
              <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-[#209dd7] to-[#753991] flex items-center justify-center text-xs font-bold shadow-inner">
                U
              </div>
              <span class="text-sm font-medium text-gray-200">user</span>
            </div>
            <button onclick="logout()" class="flex items-center space-x-1.5 bg-white/5 hover:bg-red-500/20 text-gray-300 hover:text-red-300 px-3 py-1.5 rounded-lg text-sm btn-transition group">
              ${icons.logout}
              <span>Logout</span>
            </button>
          </div>
        </header>

        <!-- Main Workspace -->
        <div class="flex-1 flex overflow-hidden bg-[#f4f7fb]">
          
          <!-- Board Area -->
          <main class="flex-1 p-6 overflow-x-auto overflow-y-hidden h-full">
            <div class="flex space-x-6 h-full items-start">
              ${board.columns.map(col => `
                <div class="kanban-column bg-gray-100/70 border border-gray-200 rounded-xl w-80 min-w-[20rem] flex flex-col shadow-sm max-h-full transition-colors border-2 border-transparent"
                     ondragover="dragOver(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="drop(event, ${col.id})">
                  
                  <div class="p-4 border-b border-gray-200/50 flex items-center justify-between bg-white/50 rounded-t-xl sticky top-0 backdrop-blur-sm z-10">
                    <div class="flex items-center space-x-2">
                      <div class="w-2.5 h-2.5 rounded-full ${col.title === 'Done' ? 'bg-green-400' : col.title === 'In Progress' ? 'bg-[#ecad0a]' : 'bg-[#209dd7]'}"></div>
                      <h2 class="font-bold text-[#032147] text-sm uppercase tracking-wide">${col.title}</h2>
                      <span class="text-xs bg-white text-[#888888] font-semibold px-2.5 py-0.5 rounded-full shadow-sm border border-gray-100">${col.cards.length}</span>
                    </div>
                    <button onclick="addCard(${col.id})" class="p-1.5 bg-white shadow-sm rounded-md text-gray-400 hover:text-[#209dd7] hover:bg-[#209dd7]/10 btn-transition" title="Add Card">
                      ${icons.plus}
                    </button>
                  </div>

                  <div class="p-3 flex-1 overflow-y-auto space-y-3 min-h-[150px]">
                    ${col.cards.map(card => `
                      <div class="kanban-card bg-white p-3.5 rounded-lg border border-gray-200 shadow-sm relative border-l-4 border-l-transparent hover:border-l-[#209dd7] btn-transition cursor-grab active:cursor-grabbing group"
                           draggable="true" ondragstart="dragStart(event, ${card.id})" ondragend="dragEnd(event)">
                        
                        <div class="flex justify-between items-start mb-1 gap-2">
                          <h3 class="font-semibold text-gray-800 text-sm leading-tight">${card.title}</h3>
                          <div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity space-x-1 shrink-0 bg-white/90 backdrop-blur rounded p-1 absolute top-2 right-2 shadow-sm border border-gray-100">
                            <button onclick="editCard(${card.id}, event)" class="p-1 text-gray-400 hover:text-[#209dd7] rounded btn-transition bg-white hover:bg-gray-50" title="Edit">
                              ${icons.edit}
                            </button>
                            <button onclick="deleteCard(${card.id}, event)" class="p-1 text-gray-400 hover:text-red-500 rounded btn-transition bg-white hover:bg-gray-50" title="Delete">
                              ${icons.trash}
                            </button>
                          </div>
                        </div>
                        
                        ${card.description ? `<p class="text-xs text-gray-500 mt-2 line-clamp-3 leading-relaxed">${card.description}</p>` : ''}
                        
                        <div class="mt-3 flex items-center justify-between border-t border-gray-50 pt-2">
                           <span class="text-[10px] text-gray-400 font-medium">ID: #${card.id}</span>
                           <div class="w-5 h-5 rounded-full bg-gray-100 flex items-center justify-center text-[10px] text-gray-500 font-bold border border-gray-200">
                             U
                           </div>
                        </div>
                      </div>
                    `).join('')}
                    <!-- Empty drop target helper -->
                    <div class="h-8 rounded-lg border-2 border-dashed border-transparent transition-colors"></div>
                  </div>
                </div>
              `).join('')}
              
              <!-- Add new column button placeholder -->
              <button class="w-80 min-w-[20rem] h-[52px] rounded-xl border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-500 hover:text-[#209dd7] hover:border-[#209dd7] hover:bg-[#209dd7]/5 btn-transition group">
                 <div class="flex items-center space-x-2">
                   ${icons.plus}
                   <span class="font-semibold text-sm">Add Column</span>
                 </div>
              </button>
            </div>
          </main>

          <!-- AI Assistant Sidebar -->
          <aside class="bg-white border-l border-gray-200 w-80 md:w-96 flex flex-col shadow-[-4px_0_15px_-3px_rgba(0,0,0,0.05)] z-10 shrink-0">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-gray-50 to-white">
              <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-[#753991]/10 flex items-center justify-center text-[#753991]">
                  ${icons.bot}
                </div>
                <h2 class="font-bold text-[#032147] text-sm">AI Assistant</h2>
              </div>
            </div>
            
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50/50">
              ${messages.length === 0 ? `
                <div class="h-full flex flex-col items-center justify-center text-center px-4 opacity-70">
                  <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#753991]/20 to-[#209dd7]/20 flex items-center justify-center text-[#753991] mb-4 shadow-sm">
                    ${icons.bot}
                  </div>
                  <h3 class="text-sm font-bold text-[#032147] mb-1">How can I help?</h3>
                  <p class="text-xs text-[#888888] leading-relaxed">I can create cards, move them around, or edit their details. Just ask!</p>
                </div>
              ` : ''}
              
              ${messages.map(m => `
                <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in-up">
                  ${m.role === 'assistant' ? `
                    <div class="w-7 h-7 rounded-full bg-gradient-to-br from-[#753991] to-[#602b79] flex items-center justify-center text-white shrink-0 mr-2 shadow-sm">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path><path d="M12 8v14"></path><path d="M16 12h-8"></path></svg>
                    </div>
                  ` : ''}
                  <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm shadow-sm ${
                    m.role === 'user' 
                      ? 'bg-gradient-to-r from-[#209dd7] to-[#1a85b6] text-white rounded-br-sm' 
                      : 'bg-white border border-gray-100 text-gray-700 rounded-bl-sm'
                  }">
                    ${m.content}
                  </div>
                </div>
              `).join('')}
            </div>
            
            <form onsubmit="sendAiMessage(event)" class="p-3 bg-white border-t border-gray-100 shadow-[0_-4px_10px_-5px_rgba(0,0,0,0.05)]">
              <div class="relative flex items-end bg-gray-50 border border-gray-200 rounded-xl focus-within:ring-2 focus-within:ring-[#753991]/30 focus-within:border-[#753991] transition-all p-1">
                <input type="text" id="ai-input" placeholder="Ask AI to manage board..." class="flex-1 bg-transparent text-sm px-3 py-2.5 focus:outline-none min-w-0" autocomplete="off" />
                <button type="submit" id="ai-send-btn" class="shrink-0 bg-[#753991] hover:bg-[#602b79] text-white p-2 rounded-lg btn-transition m-0.5 shadow-sm">
                  ${icons.send}
                </button>
              </div>
            </form>
          </aside>
        </div>
      `;
      
      // Auto-scroll chat to bottom
      const chatContainer = document.getElementById('chat-messages');
      if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Initialize application
    render();
  </script>
</body>
</html>
